@if (showDashboard) {
  <app-dashboard (logout)="logout()" />
} @else {
  <div class="split-login-container">
    <!-- Panel Izquierdo: Contenedor Blanco con Forma Orgánica y Formulario -->
    <section class="login-panel" aria-labelledby="login-brand">
      <!-- Curva de transición orgánica que fluye hacia la fotografía universitaria -->
      <svg class="curve-wave-divider" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <path d="M 0,0 C 70,14 100,28 78,48 C 52,70 14,82 55,100 L 0,100 Z" fill="#FFFFFF" />
      </svg>

      <div class="login-panel-content">
        <!-- Logotipo Oficial de la Facultad de Informática -->
        <header class="brand-top">
          <img
            class="brand-logo"
            src="/assets/logo-fif.png"
            alt="Facultad de Informática — UAQ"
          />
        </header>

        <!-- Títulos solicitados -->
        <div class="welcome-heading">
          <span class="welcome-kicker">Bienvenido a</span>
          <h1 id="login-brand" class="brand-name">INFOUAQ</h1>
          <div class="institutional-subtext">
            <span>Universidad Autónoma de Querétaro</span>
            <small>Facultad de Informática</small>
          </div>
        </div>

        <!-- Formulario -->
        <form class="auth-form" (ngSubmit)="onSubmit()" #loginForm="ngForm">
          <!-- Campo Correo -->
          <div class="form-input-group">
            <label for="userEmail">Correo electrónico</label>
            <div class="input-line-wrapper">
              <input
                id="userEmail"
                name="email"
                type="email"
                [(ngModel)]="email"
                placeholder="usuario@alumnos.uaq.mx"
                autocomplete="username"
                required
              />
            </div>
            <!-- Indicación requerida debajo del correo -->
            <small class="field-hint">
              Debe ser el correo institucional (@uaq.mx o @alumnos.uaq.mx)
            </small>
          </div>

          <!-- Campo Contraseña -->
          <div class="form-input-group">
            <label for="userPass">Contraseña</label>
            <div class="input-line-wrapper password-wrapper">
              <input
                id="userPass"
                name="password"
                [type]="showPassword ? 'text' : 'password'"
                [(ngModel)]="password"
                placeholder="••••••••"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                class="btn-toggle-pass"
                (click)="showPassword = !showPassword"
                [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
              >
                {{ showPassword ? 'Ocultar' : 'Mostrar' }}
              </button>
            </div>
          </div>

          <!-- Alerta de Validación / Error -->
          @if (message) {
            <div class="login-alert-error" role="alert">
              <span>{{ message }}</span>
            </div>
          }

          <!-- Botón de Inicio de Sesión Institucional -->
          <button type="submit" class="btn-login-submit">
            INICIAR SESIÓN
          </button>
        </form>

        <footer class="login-footer">
          <span>Repositorio Académico Institucional</span>
        </footer>
      </div>
    </section>

    <!-- Panel Derecho: Fotografía Limpia de las Instalaciones con Overlay Azul Marino -->
    <div class="visual-panel" aria-hidden="true">
      <div class="visual-overlay"></div>
    </div>
  </div>
}
